# Production: собранный Nest + Postgres
# Запуск: docker compose -f compose.prod.yml up -d --build

services:
  postgres:
    image: postgres:15-alpine
    container_name: lingostan-backend-postgres
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network
    # Креды БД — из .env на сервере (POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB)
    env_file:
      - ./.env
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production # стадия production: dist/ + start:prod
    container_name: lingostan-backend-api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - app-network
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      # В .env часто POSTGRES_HOST=0.0.0.0 — внутри Docker-сети нужен сервис postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./.env:/usr/src/app/.env:ro
      # Загрузки пользователей сохраняются между деплоями (не в образе)
      - uploads_data:/usr/src/app/public/uploads
    restart: unless-stopped
    healthcheck:
      # Проверка доступности Swagger (/api)
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata: # данные Postgres (prod)
  uploads_data: # media из POST /api/files/upload

networks:
  app-network:
    driver: bridge
